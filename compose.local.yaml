services:
  frontend:
    build:
      context: ./services/frontend
      args:
        NEXT_PUBLIC_AGENT_URL: "${NEXT_PUBLIC_AGENT_URL:-http://localhost:8000}"

  agent:
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    environment:
      AWS_PROFILE: "${AWS_PROFILE:-default}"
      AWS_SHARED_CREDENTIALS_FILE: /aws/credentials
      AWS_CONFIG_FILE: /aws/config
    volumes:
      - ${HOME}/.aws:/aws:ro

  yolo:
    build:
      context: ./services/yolo
    ports:
      - "8080:8080"
    environment:
      AWS_PROFILE: "${AWS_PROFILE:-default}"
      AWS_SHARED_CREDENTIALS_FILE: /aws/credentials
      AWS_CONFIG_FILE: /aws/config
    volumes:
      - ${HOME}/.aws:/aws:ro
