services:
  frontend:
    image: "${FRONTEND_IMAGE:-polyai-fursa-frontend:latest}"
    ports:
      - "3000:3000"
    depends_on:
      - agent
    networks:
      - polyai-net

  agent:
    image: "${AGENT_IMAGE:-polyai-fursa-agent:latest}"
    env_file:
      - ./services/agent/.env
    environment:
      YOLO_SERVICE_URL: http://yolo:8080
      AWS_REGION: "${AWS_REGION:-us-east-1}"
    ports:
      - "8000:8000"
    depends_on:
      - yolo
    networks:
      - polyai-net

  yolo:
    image: "${YOLO_IMAGE:-polyai-fursa-yolo:latest}"
    env_file:
      - ./services/agent/.env
    environment:
      AWS_REGION: "${AWS_REGION:-us-east-1}"
    networks:
      - polyai-net
  node-exporter:
    image: prom/node-exporter
    ports:
      - "9100:9100"
    networks:
      - monitoring-net
  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - yolo
      - node-exporter
    networks:
      - polyai-net
      - monitoring-net

  grafana:
    image: grafana/grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - monitoring-net


volumes:
  prometheus-data:
  grafana-data:

networks:
  polyai-net:
  monitoring-net:
