services:
  frontend:
    build:
      context: ./services/frontend
      args:
        NEXT_PUBLIC_AGENT_URL: "${NEXT_PUBLIC_AGENT_URL:-http://localhost:8000}"
    ports:
      - "3000:3000"
    depends_on:
      - agent
    networks:
      - polyai-net

  agent:
    build:
      context: ./services/agent
    env_file:
      - ./services/agent/.env
    environment:
      YOLO_SERVICE_URL: http://yolo:8080
      AWS_REGION: "${AWS_REGION:-us-east-1}"
    ports:
      - "8000:8000"
    depends_on:
      - yolo
    networks:
      - polyai-net

  yolo:
    build:
      context: ./services/yolo
    env_file:
      - ./services/agent/.env
    environment:
      AWS_REGION: "${AWS_REGION:-us-east-1}"
    networks:
      - polyai-net

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - yolo
    networks:
      - polyai-net
      - monitoring-net

  grafana:
    image: grafana/grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - monitoring-net

volumes:
  prometheus-data:
  grafana-data:

networks:
  polyai-net:
  monitoring-net: