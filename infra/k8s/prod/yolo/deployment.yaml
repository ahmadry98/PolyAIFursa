apiVersion: apps/v1
kind: Deployment
metadata:
  name: yolo
  labels:
    app.kubernetes.io/name: yolo
    app.kubernetes.io/part-of: polyai-fursa
spec:
  replicas: 1
  revisionHistoryLimit: 5
  minReadySeconds: 10
  strategy:
    # YOLO is memory-heavy and this single node cannot fit two copies.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: yolo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yolo
        app.kubernetes.io/part-of: polyai-fursa
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: yolo
          image: docker.io/ahmadray98/polyai-fursa-yolo:7318fb683746f530335a83f7d8f3760255eb57d4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: AWS_S3_BUCKET
              value: ahmad-polyai-images
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
