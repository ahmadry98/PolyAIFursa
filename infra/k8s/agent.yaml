apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent
  template:
    metadata:
      labels:
        app: agent
    spec:
      containers:
        - name: agent
          image: docker.io/ahmadray98/polyai-fursa-agent:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: MODEL
              value: bedrock/openai.gpt-oss-20b-1:0
            - name: AWS_S3_BUCKET
              value: ahmad-polyai-images
            - name: YOLO_SERVICE_URL
              value: http://yolo-svc:8080
            - name: IMG_PROC_MCP_URL
              value: http://img-proc-mcp-svc:8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: agent-svc
spec:
  type: NodePort
  selector:
    app: agent
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30081
