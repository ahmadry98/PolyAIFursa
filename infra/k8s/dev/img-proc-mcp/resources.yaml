apiVersion: apps/v1
kind: Deployment
metadata:
  name: img-proc-mcp
  labels:
    app.kubernetes.io/name: img-proc-mcp
    app.kubernetes.io/part-of: polyai-fursa
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: img-proc-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: img-proc-mcp
        app.kubernetes.io/part-of: polyai-fursa
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: img-proc-mcp
          image: docker.io/ahmadray98/polyai-fursa-img-proc-mcp:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 9000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: img-proc-mcp-svc
  labels:
    app.kubernetes.io/name: img-proc-mcp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: img-proc-mcp
  ports:
    - name: http
      port: 9000
      targetPort: http
      protocol: TCP
