apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-autoscaler-scale-test
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cluster-autoscaler-scale-test
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cluster-autoscaler-scale-test
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10.1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 1500m
              memory: 512Mi
            limits:
              cpu: 1500m
              memory: 512Mi
