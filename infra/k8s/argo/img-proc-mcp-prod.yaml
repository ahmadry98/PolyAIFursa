apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: img-proc-mcp-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/ahmadry98/PolyAIFursa.git
    targetRevision: main
    path: infra/k8s/prod/img-proc-mcp

  destination:
    server: https://kubernetes.default.svc
    namespace: prod

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
