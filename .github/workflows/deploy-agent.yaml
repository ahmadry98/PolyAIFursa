name: Deploy Agent

on:
  push:
    branches:
      - dev
      - main
    paths:
      - "services/agent/**"
      - ".github/workflows/deploy-agent.yaml"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/polyai-fursa-agent
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/agent/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Deploy agent to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ github.ref_name == 'dev' && 'dev.ahmad.fursa.click' || 'prod.ahmad.fursa.click' }}
          username: ubuntu
          key: ${{ github.ref_name == 'dev' && secrets.DEV_INSTANCE_SSH_KEY || secrets.PROD_INSTANCE_SSH_KEY }}
          script: |
            cd /home/ubuntu/PolyAIFursa
            touch .env

            set_env() {
              key="$1"
              value="$2"
              if grep -q "^${key}=" .env; then
                sed -i "s|^${key}=.*|${key}=${value}|" .env
              else
                printf "%s=%s\n" "$key" "$value" >> .env
              fi
            }

            set_env AGENT_IMAGE "${{ env.IMAGE_NAME }}"
            set_env AGENT_IMAGE_TAG "${{ env.IMAGE_TAG }}"

            docker compose pull
            docker compose up -d --remove-orphans
