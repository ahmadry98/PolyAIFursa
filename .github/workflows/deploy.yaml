name: Deploy PolyAI

on:
  push:
    branches:
      - main
      - dev

jobs:
  deploy-dev:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Dev instance
        uses: appleboy/ssh-action@v1
        with:
          host: dev.ahmad.fursa.click
          username: ubuntu
          key: ${{ secrets.DEV_INSTANCE_SSH_KEY }}
          script: |
            cd /home/ubuntu/PolyAIFursa
            git fetch origin
            git reset --hard origin/dev

            sudo cp deploy/systemd/*.service /etc/systemd/system/
            sudo systemctl daemon-reload

            cd /home/ubuntu/PolyAIFursa/services/yolo
            source .venv/bin/activate
            pip install -r requirements.txt
            python -c "import app; app.init_db()"

            cd /home/ubuntu/PolyAIFursa/services/agent
            source .venv/bin/activate
            pip install -r requirements.txt

            cd /home/ubuntu/PolyAIFursa/services/frontend
            npm install
            npm run build

            sudo systemctl enable yolo agent frontend
            sudo systemctl restart yolo agent frontend

            sudo systemctl status yolo --no-pager
            sudo systemctl status agent --no-pager
            sudo systemctl status frontend --no-pager

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Prod instance
        uses: appleboy/ssh-action@v1
        with:
          host: prod.ahmad.fursa.click
          username: ubuntu
          key: ${{ secrets.PROD_INSTANCE_SSH_KEY }}
          script: |
            cd /home/ubuntu/PolyAIFursa
            git fetch origin
            git reset --hard origin/main

            sudo cp deploy/systemd/*.service /etc/systemd/system/
            sudo systemctl daemon-reload

            cd /home/ubuntu/PolyAIFursa/services/yolo
            source .venv/bin/activate
            pip install -r requirements.txt
            python -c "import app; app.init_db()"

            cd /home/ubuntu/PolyAIFursa/services/agent
            source .venv/bin/activate
            pip install -r requirements.txt

            cd /home/ubuntu/PolyAIFursa/services/frontend
            npm install
            npm run build

            sudo systemctl enable yolo agent frontend
            sudo systemctl restart yolo agent frontend

            sudo systemctl status yolo --no-pager
            sudo systemctl status agent --no-pager
            sudo systemctl status frontend --no-pager