name: Deploy PolyAI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main
    types:
      - closed

jobs:
  deploy-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Dev instance
        uses: appleboy/ssh-action@v1
        with:
          host: dev.ahmad.fursa.click
          username: ubuntu
          key: ${{ secrets.DEV_INSTANCE_SSH_KEY }}
          script: |
            cd /home/ubuntu/PolyAIFursa
            git fetch origin
            git reset --hard origin/dev

            sudo systemctl disable --now yolo agent frontend || true

            docker compose config
            docker compose up -d --build --remove-orphans
            docker compose ps

  deploy-prod:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Prod instance
        uses: appleboy/ssh-action@v1
        with:
          host: prod.ahmad.fursa.click
          username: ubuntu
          key: ${{ secrets.PROD_INSTANCE_SSH_KEY }}
          script: |
            cd /home/ubuntu/PolyAIFursa
            git fetch origin
            git reset --hard origin/main

            docker compose config
            docker compose build

            sudo systemctl disable --now yolo agent frontend || true

            docker compose up -d --remove-orphans
            docker compose ps
