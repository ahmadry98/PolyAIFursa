name: Run Tests

on:
  push:
    branches:
      - main
      - dev
      - "**"
  pull_request:
    branches:
      - main

jobs:
  test-yolo:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YOLO dependencies
        run: |
          pip install -r services/yolo/torch-requirements.txt
          pip install -r services/yolo/requirements.txt
          pip install pytest-cov

      - name: Run YOLO tests
        run: pytest tests/ --cov=app --cov-report=xml
        working-directory: services/yolo

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: services/yolo/coverage.xml

  test-agent:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/agent

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Agent dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run Agent tests
        env:
          MODEL: openai:gpt-5.4-mini
          OPENAI_API_KEY: fake-key
        run: pytest tests