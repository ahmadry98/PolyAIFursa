name: Provision and bootstrap Kubernetes cluster

on:
  workflow_dispatch:
    inputs:
      region:
        description: AWS region to provision
        required: true
        default: us-east-1
        type: string
      alert_email:
        description: Email address that receives Alertmanager notifications
        required: true
        type: string
      enable_cluster_autoscaler:
        description: Install the optional AWS Cluster Autoscaler
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: kubernetes-cluster-${{ inputs.region }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"

jobs:
  provision:
    name: Provision infrastructure
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    env:
      TF_VAR_alert_email: ${{ inputs.alert_email }}
      TF_VAR_enable_cluster_autoscaler: ${{ inputs.enable_cluster_autoscaler }}

    outputs:
      alert_sns_topic_arn: ${{ steps.terraform_outputs.outputs.alert_sns_topic_arn }}
      control_plane_ip: ${{ steps.terraform_outputs.outputs.control_plane_ip }}
      control_plane_security_group_id: ${{ steps.terraform_outputs.outputs.control_plane_security_group_id }}
      worker_asg_name: ${{ steps.terraform_outputs.outputs.worker_asg_name }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6.0.2

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ inputs.region }}
          role-session-name: polyai-cluster-${{ github.run_id }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Prepare the cluster SSH public key
        env:
          CLUSTER_SSH_PRIVATE_KEY: ${{ secrets.CLUSTER_SSH_PRIVATE_KEY }}
        run: |
          install -d -m 0700 "${HOME}/.ssh"
          printf '%s\n' "${CLUSTER_SSH_PRIVATE_KEY}" \
            > "${HOME}/.ssh/polyai-k8s"
          chmod 0600 "${HOME}/.ssh/polyai-k8s"

          public_key="$(ssh-keygen -y -f "${HOME}/.ssh/polyai-k8s")"
          echo "TF_VAR_ssh_public_key=${public_key}" >> "${GITHUB_ENV}"

      - name: Verify the regional variable file
        working-directory: infra/tf
        env:
          REGION: ${{ inputs.region }}
        run: |
          test -f "tfvars/${REGION}.tfvars"

      - name: Initialize Terraform
        working-directory: infra/tf
        run: terraform init -input=false

      - name: Select or create the regional workspace
        working-directory: infra/tf
        env:
          REGION: ${{ inputs.region }}
        run: |
          terraform workspace select "${REGION}" ||
            terraform workspace new "${REGION}"

      - name: Validate Terraform
        working-directory: infra/tf
        run: |
          terraform fmt -check -recursive
          terraform validate

      - name: Plan the infrastructure
        working-directory: infra/tf
        env:
          REGION: ${{ inputs.region }}
        run: |
          terraform plan \
            -input=false \
            -var-file="tfvars/${REGION}.tfvars" \
            -out="cluster.tfplan"

      - name: Apply the infrastructure
        working-directory: infra/tf
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            "cluster.tfplan"

      - name: Export Terraform outputs
        id: terraform_outputs
        working-directory: infra/tf
        run: |
          {
            echo "alert_sns_topic_arn=$(terraform output -raw alert_sns_topic_arn)"
            echo "control_plane_ip=$(terraform output -raw control_plane_public_ip)"
            echo "control_plane_security_group_id=$(terraform output -raw control_plane_security_group_id)"
            echo "worker_asg_name=$(terraform output -raw worker_asg_name)"
          } >> "${GITHUB_OUTPUT}"

  bootstrap:
    name: Bootstrap cluster services
    needs: provision
    runs-on: ubuntu-latest

    env:
      ALERT_SNS_TOPIC_ARN: ${{ needs.provision.outputs.alert_sns_topic_arn }}
      CONTROL_PLANE_IP: ${{ needs.provision.outputs.control_plane_ip }}
      CONTROL_PLANE_SECURITY_GROUP_ID: ${{ needs.provision.outputs.control_plane_security_group_id }}
      SSH_KEY_PATH: /home/runner/.ssh/polyai-k8s
      WORKER_ASG_NAME: ${{ needs.provision.outputs.worker_asg_name }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6.0.2

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ inputs.region }}
          role-session-name: polyai-bootstrap-${{ github.run_id }}

      - name: Prepare the cluster SSH private key
        env:
          CLUSTER_SSH_PRIVATE_KEY: ${{ secrets.CLUSTER_SSH_PRIVATE_KEY }}
        run: |
          install -d -m 0700 "${HOME}/.ssh"
          printf '%s\n' "${CLUSTER_SSH_PRIVATE_KEY}" > "${SSH_KEY_PATH}"
          chmod 0600 "${SSH_KEY_PATH}"

      - name: Ensure a worker is available for bootstrap
        run: |
          desired_capacity="$(
            aws autoscaling describe-auto-scaling-groups \
              --auto-scaling-group-names "${WORKER_ASG_NAME}" \
              --query 'AutoScalingGroups[0].DesiredCapacity' \
              --output text
          )"

          if [[ "${desired_capacity}" == "None" ]]; then
            echo "Worker Auto Scaling Group ${WORKER_ASG_NAME} was not found" >&2
            exit 1
          fi

          if (( desired_capacity < 1 )); then
            echo "Restoring one worker for cluster bootstrap"
            aws autoscaling set-desired-capacity \
              --auto-scaling-group-name "${WORKER_ASG_NAME}" \
              --desired-capacity 1 \
              --no-honor-cooldown
          fi

          for attempt in $(seq 1 60); do
            in_service_workers="$(
              aws autoscaling describe-auto-scaling-groups \
                --auto-scaling-group-names "${WORKER_ASG_NAME}" \
                --query "length(AutoScalingGroups[0].Instances[?LifecycleState=='InService'])" \
                --output text
            )"

            if (( in_service_workers >= 1 )); then
              echo "Worker instance is InService"
              break
            fi

            if (( attempt == 60 )); then
              echo "Timed out waiting for an InService worker instance" >&2
              aws autoscaling describe-scaling-activities \
                --auto-scaling-group-name "${WORKER_ASG_NAME}" \
                --max-items 10
              exit 1
            fi

            echo "Waiting for an InService worker instance (${attempt}/60)"
            sleep 10
          done

      - name: Detect the GitHub runner public IP
        id: runner_ip
        run: |
          runner_ip="$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')"

          if [[ ! "${runner_ip}" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            echo "Unable to determine a valid runner IPv4 address" >&2
            exit 1
          fi

          echo "cidr=${runner_ip}/32" >> "${GITHUB_OUTPUT}"

      - name: Temporarily allow SSH from the GitHub runner
        id: open_ssh
        env:
          RUNNER_CIDR: ${{ steps.runner_ip.outputs.cidr }}
        run: |
          permissions="$(
            jq -nc \
              --arg cidr "${RUNNER_CIDR}" \
              --arg description "GitHub Actions bootstrap ${GITHUB_RUN_ID}" \
              '[{
                IpProtocol: "tcp",
                FromPort: 22,
                ToPort: 22,
                IpRanges: [{
                  CidrIp: $cidr,
                  Description: $description
                }]
              }]'
          )"

          rule_id="$(
            aws ec2 authorize-security-group-ingress \
              --group-id "${CONTROL_PLANE_SECURITY_GROUP_ID}" \
              --ip-permissions "${permissions}" \
              --query 'SecurityGroupRules[0].SecurityGroupRuleId' \
              --output text
          )"

          echo "security_group_rule_id=${rule_id}" >> "${GITHUB_OUTPUT}"

      - name: Wait for the control plane
        run: |
          connected=false

          for attempt in $(seq 1 60); do
            if ssh \
              -i "${SSH_KEY_PATH}" \
              -o BatchMode=yes \
              -o ConnectTimeout=10 \
              -o StrictHostKeyChecking=accept-new \
              "ubuntu@${CONTROL_PLANE_IP}" \
              true; then
              connected=true
              break
            fi

            echo "SSH is not ready yet (${attempt}/60)"
            sleep 10
          done

          if [[ "${connected}" != "true" ]]; then
            echo "Timed out waiting for SSH" >&2
            exit 1
          fi

          timeout 1200 ssh \
            -i "${SSH_KEY_PATH}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            "ubuntu@${CONTROL_PLANE_IP}" \
            'bash -se' <<'REMOTE'
          set +e
          cloud-init status --wait
          cloud_init_status=$?
          set -e

          case "${cloud_init_status}" in
            0)
              ;;
            2)
              echo "cloud-init completed with recoverable errors; validating the cluster bootstrap"
              ;;
            *)
              echo "cloud-init failed with exit code ${cloud_init_status}" >&2
              exit "${cloud_init_status}"
              ;;
          esac

          sudo test -f /var/lib/polyai-control-plane-ready
          sudo test -f /etc/kubernetes/admin.conf
          sudo systemctl is-active --quiet crio
          sudo systemctl is-active --quiet kubelet
          REMOTE

      - name: Install and verify Calico
        run: |
          ssh \
            -i "${SSH_KEY_PATH}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            "ubuntu@${CONTROL_PLANE_IP}" \
            'bash -se' <<'REMOTE'
          set -Eeuo pipefail

          kubectl apply \
            --server-side \
            --force-conflicts \
            -f https://raw.githubusercontent.com/projectcalico/calico/v3.32.1/manifests/v1_crd_projectcalico_org.yaml

          kubectl apply \
            --server-side \
            --force-conflicts \
            -f https://raw.githubusercontent.com/projectcalico/calico/v3.32.1/manifests/tigera-operator.yaml

          kubectl rollout status \
            deployment/tigera-operator \
            -n tigera-operator \
            --timeout=300s
          REMOTE

      - name: Configure Calico and verify worker readiness
        run: |
          ssh \
            -i "${SSH_KEY_PATH}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            "ubuntu@${CONTROL_PLANE_IP}" \
            'kubectl apply -f -' \
            < infra/k8s/calico/custom-resources.yaml

          ssh \
            -i "${SSH_KEY_PATH}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            "ubuntu@${CONTROL_PLANE_IP}" \
            'bash -se' <<'REMOTE'
          set -Eeuo pipefail

          kubectl wait \
            tigerastatus/calico \
            --for=create \
            --timeout=300s

          kubectl wait \
            tigerastatus/apiserver \
            --for=create \
            --timeout=300s

          kubectl wait \
            tigerastatus/calico \
            --for=condition=Available \
            --timeout=600s

          kubectl wait \
            tigerastatus/apiserver \
            --for=condition=Available \
            --timeout=600s

          for attempt in $(seq 1 60); do
            ready_nodes="$(
              kubectl get nodes --no-headers |
                awk '$2 == "Ready" { count++ } END { print count + 0 }'
            )"

            if (( ready_nodes >= 2 )); then
              encapsulation="$(
                kubectl get installation default \
                  -o jsonpath='{.spec.calicoNetwork.ipPools[0].encapsulation}'
              )"

              if [[ "${encapsulation}" != "VXLAN" ]]; then
                echo "Expected Calico VXLAN, found ${encapsulation}" >&2
                exit 1
              fi

              echo "Calico encapsulation: ${encapsulation}"
              kubectl get nodes -o wide
              exit 0
            fi

            echo "Waiting for two Ready nodes (${attempt}/60)"
            sleep 10
          done

          kubectl get nodes -o wide
          echo "Timed out waiting for the control plane and one worker" >&2
          exit 1
          REMOTE

      - name: Collect worker bootstrap diagnostics
        if: ${{ failure() }}
        run: |
          echo "Worker Auto Scaling Group state:"
          aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "${WORKER_ASG_NAME}" \
            --query 'AutoScalingGroups[0].{Min:MinSize,Max:MaxSize,Desired:DesiredCapacity,Instances:Instances}' \
            --output json

          echo "Recent scaling activities:"
          aws autoscaling describe-scaling-activities \
            --auto-scaling-group-name "${WORKER_ASG_NAME}" \
            --max-items 10 \
            --query 'Activities[].{Status:StatusCode,Description:Description,Cause:Cause,Message:StatusMessage}' \
            --output table

          worker_instance_ids="$(
            aws autoscaling describe-auto-scaling-groups \
              --auto-scaling-group-names "${WORKER_ASG_NAME}" \
              --query 'AutoScalingGroups[0].Instances[].InstanceId' \
              --output text
          )"

          for instance_id in ${worker_instance_ids}; do
            echo "Console output for ${instance_id}:"
            aws ec2 get-console-output \
              --instance-id "${instance_id}" \
              --latest \
              --query Output \
              --output text || true
          done

      - name: Install Helm and platform add-ons
        env:
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          REGION: ${{ inputs.region }}
        run: |
          if [[ -z "${GRAFANA_ADMIN_PASSWORD}" ]]; then
            echo "GRAFANA_ADMIN_PASSWORD repository secret is required" >&2
            exit 1
          fi

          ssh \
            -i "${SSH_KEY_PATH}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            "ubuntu@${CONTROL_PLANE_IP}" \
            'bash -se' <<'REMOTE'
          set -Eeuo pipefail

          if ! command -v helm >/dev/null 2>&1; then
            helm_tmp_dir="$(mktemp -d)"
            curl -fsSL \
              https://get.helm.sh/helm-v3.19.2-linux-amd64.tar.gz \
              -o "${helm_tmp_dir}/helm.tar.gz"
            tar -xzf "${helm_tmp_dir}/helm.tar.gz" -C "${helm_tmp_dir}"
            sudo install -m 0755 "${helm_tmp_dir}/linux-amd64/helm" /usr/local/bin/helm
          fi

          helm version
          helm repo add aws-ebs-csi-driver \
            https://kubernetes-sigs.github.io/aws-ebs-csi-driver
          helm repo add autoscaler \
            https://kubernetes.github.io/autoscaler
          helm repo add ingress-nginx \
            https://kubernetes.github.io/ingress-nginx
          helm repo add prometheus-community \
            https://prometheus-community.github.io/helm-charts
          helm repo update
          REMOTE

          ssh \
            -i "${SSH_KEY_PATH}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            "ubuntu@${CONTROL_PLANE_IP}" \
            "helm upgrade --install aws-ebs-csi-driver aws-ebs-csi-driver/aws-ebs-csi-driver --version 2.60.1 --namespace kube-system --set controller.region=${REGION} --wait --timeout 10m"

          ssh \
            -i "${SSH_KEY_PATH}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            "ubuntu@${CONTROL_PLANE_IP}" \
            'kubectl apply -f -' \
            < infra/k8s/storage/ebs-sc.yaml

          ssh \
            -i "${SSH_KEY_PATH}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            "ubuntu@${CONTROL_PLANE_IP}" \
            'helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx --version 4.15.1 --namespace ingress-nginx --create-namespace --values - --wait --timeout 10m' \
            < infra/k8s/ingress-nginx/values.yaml

          ssh \
            -i "${SSH_KEY_PATH}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            "ubuntu@${CONTROL_PLANE_IP}" \
            'kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -'

          printf '%s' "${GRAFANA_ADMIN_PASSWORD}" | \
            ssh \
              -i "${SSH_KEY_PATH}" \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=accept-new \
              "ubuntu@${CONTROL_PLANE_IP}" \
              'kubectl create secret generic grafana-admin-credentials --namespace monitoring --from-literal=admin-user=admin --from-file=admin-password=/dev/stdin --dry-run=client -o yaml | kubectl apply -f -'

          sed \
            -e "s|SNS_TOPIC_ARN_PLACEHOLDER|${ALERT_SNS_TOPIC_ARN}|g" \
            -e "s|AWS_REGION_PLACEHOLDER|${REGION}|g" \
            infra/k8s/monitoring/values.yaml | \
            ssh \
              -i "${SSH_KEY_PATH}" \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=accept-new \
              "ubuntu@${CONTROL_PLANE_IP}" \
              'helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack --version 86.0.0 --namespace monitoring --values - --wait --timeout 15m'

          ssh \
            -i "${SSH_KEY_PATH}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            "ubuntu@${CONTROL_PLANE_IP}" \
            'kubectl apply --dry-run=server -f -' \
            < infra/k8s/monitoring/resources.yaml

          ssh \
            -i "${SSH_KEY_PATH}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            "ubuntu@${CONTROL_PLANE_IP}" \
            'kubectl apply -f -' \
            < infra/k8s/monitoring/resources.yaml

          ssh \
            -i "${SSH_KEY_PATH}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            "ubuntu@${CONTROL_PLANE_IP}" \
            'bash -se' <<'REMOTE'
          set -Eeuo pipefail

          kubectl get storageclass ebs-sc
          kubectl get service ingress-nginx-controller -n ingress-nginx \
            -o jsonpath='{.spec.ports[?(@.name=="http")].nodePort}' | grep -qx 30080
          kubectl get servicemonitor ingress-nginx-controller -n ingress-nginx
          kubectl get pods -n monitoring -o wide
          REMOTE

      - name: Install optional Cluster Autoscaler
        if: ${{ inputs.enable_cluster_autoscaler }}
        env:
          REGION: ${{ inputs.region }}
        run: |
          ssh \
            -i "${SSH_KEY_PATH}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            "ubuntu@${CONTROL_PLANE_IP}" \
            "helm upgrade --install cluster-autoscaler autoscaler/cluster-autoscaler --version 9.59.0 --namespace kube-system --set cloudProvider=aws --set awsRegion=${REGION} --set autoDiscovery.clusterName= --set autoscalingGroups[0].name=${WORKER_ASG_NAME} --set autoscalingGroups[0].minSize=0 --set autoscalingGroups[0].maxSize=3 --set image.tag=v1.35.0 --set serviceMonitor.enabled=true --wait --timeout 10m"

          ssh \
            -i "${SSH_KEY_PATH}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            "ubuntu@${CONTROL_PLANE_IP}" \
            'kubectl rollout status deployment/cluster-autoscaler -n kube-system --timeout=300s'

      - name: Install and verify Argo CD
        run: |
          ssh \
            -i "${SSH_KEY_PATH}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            "ubuntu@${CONTROL_PLANE_IP}" \
            'bash -se' <<'REMOTE'
          set -Eeuo pipefail

          kubectl create namespace argocd \
            --dry-run=client \
            -o yaml |
            kubectl apply -f -

          kubectl apply \
            --server-side \
            --force-conflicts \
            -n argocd \
            -f https://raw.githubusercontent.com/argoproj/argo-cd/v3.4.2/manifests/install.yaml

          kubectl wait \
            --for=condition=Available \
            deployment \
            --all \
            -n argocd \
            --timeout=600s

          kubectl rollout status \
            statefulset/argocd-application-controller \
            -n argocd \
            --timeout=600s

          kubectl get pods -n argocd -o wide
          REMOTE

          ssh \
            -i "${SSH_KEY_PATH}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            "ubuntu@${CONTROL_PLANE_IP}" \
            'kubectl apply --dry-run=server -f -' \
            < infra/k8s/argocd-ingress.yaml

          ssh \
            -i "${SSH_KEY_PATH}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            "ubuntu@${CONTROL_PLANE_IP}" \
            'kubectl apply -f -' \
            < infra/k8s/argocd-ingress.yaml

      - name: Bootstrap namespaces and Argo CD Applications
        run: |
          ssh \
            -i "${SSH_KEY_PATH}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            "ubuntu@${CONTROL_PLANE_IP}" \
            'kubectl apply -f -' \
            < infra/k8s/00-namespaces.yaml

          ssh \
            -i "${SSH_KEY_PATH}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            "ubuntu@${CONTROL_PLANE_IP}" \
            'kubectl apply --dry-run=server -n argocd -f -' \
            < infra/k8s/argo/app-of-apps.yaml

          ssh \
            -i "${SSH_KEY_PATH}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            "ubuntu@${CONTROL_PLANE_IP}" \
            'kubectl apply -n argocd -f -' \
            < infra/k8s/argo/app-of-apps.yaml

          ssh \
            -i "${SSH_KEY_PATH}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            "ubuntu@${CONTROL_PLANE_IP}" \
            'bash -se' <<'REMOTE'
          set -Eeuo pipefail

          expected_applications=(
            app-of-apps
            agent-dev
            agent-prod
            frontend-dev
            frontend-prod
            img-proc-mcp-dev
            img-proc-mcp-prod
            yolo-dev
            yolo-prod
          )

          for attempt in $(seq 1 60); do
            missing=false

            for application in "${expected_applications[@]}"; do
              if ! kubectl get application \
                "${application}" \
                -n argocd \
                >/dev/null 2>&1; then
                missing=true
                break
              fi
            done

            if [[ "${missing}" == "false" ]]; then
              kubectl get applications -n argocd
              exit 0
            fi

            echo "Waiting for all Argo CD Applications (${attempt}/60)"
            sleep 10
          done

          kubectl get applications -n argocd
          echo "Timed out waiting for the app-of-apps children" >&2
          exit 1
          REMOTE

      - name: Remove the temporary SSH rule
        if: ${{ always() && steps.open_ssh.outputs.security_group_rule_id != '' }}
        env:
          SECURITY_GROUP_RULE_ID: ${{ steps.open_ssh.outputs.security_group_rule_id }}
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "${CONTROL_PLANE_SECURITY_GROUP_ID}" \
            --security-group-rule-ids "${SECURITY_GROUP_RULE_ID}"
