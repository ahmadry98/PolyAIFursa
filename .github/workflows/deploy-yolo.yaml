name: Build and publish YOLO

on:
  push:
    branches:
      - dev
      - main
    paths:
      - "services/yolo/**"
      - ".github/workflows/deploy-yolo.yaml"

permissions:
  contents: write

concurrency:
  group: yolo-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/polyai-fursa-yolo
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout the triggering branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Select the GitOps environment
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "DEPLOY_ENV=prod" >> "$GITHUB_ENV"
          else
            echo "DEPLOY_ENV=dev" >> "$GITHUB_ENV"
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push the immutable image
        uses: docker/build-push-action@v6
        with:
          context: services/yolo
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Update the desired image in Git
        run: |
          manifest="infra/k8s/${DEPLOY_ENV}/yolo/deployment.yaml"
          sed -i "s|image: .*polyai-fursa-yolo:.*|image: ${IMAGE_NAME}:${IMAGE_TAG}|" "$manifest"

          if git diff --quiet -- "$manifest"; then
            echo "The manifest already references this image."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$manifest"
          git commit -m "ci: deploy yolo ${IMAGE_TAG} to ${DEPLOY_ENV} [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
