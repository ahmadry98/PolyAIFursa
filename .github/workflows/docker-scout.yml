name: Docker Scout

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main
jobs:
  docker-scout:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: yolo
            context: ./services/yolo
            dockerfile: ./services/yolo/Dockerfile
            image: polyai-fursa-yolo
          - name: agent
            context: .
            dockerfile: ./services/agent/Dockerfile
            image: polyai-fursa-agent
          - name: frontend
            context: ./services/frontend
            dockerfile: ./services/frontend/Dockerfile
            image: polyai-fursa-frontend
          - name: img-proc-mcp
            context: ./services/img-proc-mcp
            dockerfile: ./services/img-proc-mcp/Dockerfile
            image: polyai-fursa-img-proc-mcp

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build ${{ matrix.service.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: false
          load: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service.image }}:${{ github.sha }}-scout

      - name: Docker Scout scan ${{ matrix.service.name }}
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service.image }}:${{ github.sha }}-scout
          only-severities: critical,high
          only-fixed: true
          exit-code: true
