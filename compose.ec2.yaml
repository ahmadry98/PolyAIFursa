# EC2-only source-build override.
#
# Use this file only when you intentionally want to build images from the code
# checked out on the EC2 instance. Normal EC2 deployment should use compose.yaml
# alone with images produced by GitHub Actions.
#
# This file deliberately does not mount ~/.aws or set AWS_PROFILE. EC2 should use
# its instance IAM role for Bedrock and S3 access.
services:
  frontend:
    build:
      context: ./services/frontend
      args:
        NEXT_PUBLIC_AGENT_URL: "${NEXT_PUBLIC_AGENT_URL:-http://dev.ahmad.fursa.click:8000}"

  agent:
    build:
      context: .
      dockerfile: services/agent/Dockerfile

  yolo:
    build:
      context: ./services/yolo
    ports:
      - "8080:8080"

  img-proc-mcp:
    build:
      context: ./services/img-proc-mcp
